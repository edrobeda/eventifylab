server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml font/woff2;

    # Assets versionados por conteudo (fontes/logos/icones) cacheiam forte;
    # CSS/JS do site (eventifylab.css/js) nao tem hash no nome, entao cache
    # curto pra nao precisar de cache-busting manual a cada deploy
    location ~* \.(woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # site multi-pagina estatico, sem fallback de SPA: caminho que nao
    # existe é 404 de verdade, nao a home silenciosamente
    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
